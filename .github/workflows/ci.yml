name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read   # CI never writes to a release; see the build job's note

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  engine:
    name: Engine tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install engine + test deps
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest

  app:
    name: App analyze + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The engine-client tests that spawn a real engine rely on the locator's
      # PATH fallback, so `python -m ipaside_engine` must be importable.
      - name: Install engine + test deps
        run: python -m pip install -r requirements-dev.txt

      # Flutter plugins are wired up with symlinks on Windows, which needs the
      # developer-mode privilege. Runners are administrators, so set it here.
      - name: Enable symlink support
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Analyze (lints are errors)
        working-directory: src/iPASide.Flutter
        run: flutter analyze --fatal-infos

      - name: Run tests
        working-directory: src/iPASide.Flutter
        run: flutter test

  build:
    name: Build installer
    runs-on: windows-latest
    needs: [engine, app]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Enable symlink support
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (portable engine + Flutter runner + Inno Setup)
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0-ci' }
          .\packaging\build-installer.ps1 -Version $v -Python python

      # Tags build here too, so a release is always proven to build on a clean
      # machine, and the result is downloadable for inspection or comparison.
      - uses: actions/upload-artifact@v7
        with:
          name: iPASide-installer
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

      # CI deliberately does NOT publish the release. Exactly one build may ever
      # reach a release, for two reasons:
      #
      # 1. There is no iPhone on a GitHub runner, so a CI-built installer has
      #    never been installed, launched, or driven against a device. Since the
      #    installer is unsigned and users have to click through SmartScreen to
      #    run it, shipping a binary nobody has executed is the wrong trade.
      # 2. Two producers writing to one release corrupts the updater. Uploads
      #    overwrite same-named assets, so a CI build landing on a release would
      #    replace the verified installer and rewrite SHA256SUMS.txt; the updater
      #    is fail-closed on a checksum mismatch, so any mismatch between the two
      #    leaves users unable to update at all.
      #
      # Releasing is therefore deliberate: build locally, verify against a real
      # device, then `gh release create <tag> dist/installer/*` with both files.
      # See docs/releasing.md.
